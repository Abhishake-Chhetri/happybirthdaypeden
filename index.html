<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise!</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #ffebf0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .button {
            background-color: #ff4081;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        #birthdayMessage {
            display: none;
            margin-top: 20px;
        }
        img {
            width: 300px;
            border-radius: 15px;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
    </style>
    <script>
        function showSurprise() {
            document.getElementById('birthdayMessage').style.display = 'block';
            document.getElementById('surpriseButton').style.display = 'none';
        }
    </script>
</head>
<body>
    <h1>Click here for a surprise!</h1>
    <button id="surpriseButton" class="button" onclick="showSurprise()">Click Here</button>
    <div id="birthdayMessage">
        <h1>Happy Birthday Peden! 🎉🎂</h1>
        <img src="image.png" alt="Peden's Photo">
    </div>
</body>
</html>
