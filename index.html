<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Peden!</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #ffebf0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .collage {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .collage img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .poem {
            margin-top: 20px;
            font-size: 20px;
            color: #ff4081;
        }
    </style>
</head>
<body>
    <div class="collage">
        <img src="1.png" alt="Photo 1">
        <img src="2.png" alt="Photo 2">
        <img src="3.png" alt="Photo 3">
        <img src="4.png" alt="Photo 4">
    </div>
    <div class="poem">
        <p>On your birthday, joy and cheer,</p>
        <p>Smiles and laughter, love sincere.</p>
        <p>Wishing you dreams bright and true,</p>
        <p>Happiness in all you do!</p>
        <p>Though miles apart, my heart is near,</p>
        <p>A gift I can't give, but love sincere.</p>
        <p>Through every moment, far or wide,</p>
        <p>I'm always here, right by your side.</p>
    </div>
</body>
</html>
