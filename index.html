<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Peden!</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #ffebf0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .collage {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .collage img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .collage img:hover {
            transform: scale(1.1);
        }
        .fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }
        .fullscreen img {
            width: 80%;
            max-width: 600px;
            border-radius: 10px;
        }
        .poem {
            font-size: 1.2em;
            color: #ff4081;
            margin-top: 20px;
        }
        .heart {
            position: absolute;
            font-size: 2em;
            color: red;
            animation: rise 5s linear infinite;
        }
        @keyframes rise {
            0% { transform: translateY(100vh); opacity: 1; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }
    </style>
    <script>
        function enlargeImage(src) {
            const fullscreenDiv = document.getElementById('fullscreen');
            const fullscreenImg = document.getElementById('fullscreen-img');
            fullscreenImg.src = src;
            fullscreenDiv.style.display = 'flex';
        }
        function closeFullscreen() {
            document.getElementById('fullscreen').style.display = 'none';
        }
        function createHearts() {
            for (let i = 0; i < 15; i++) {
                let heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 5000);
            }
        }
        setInterval(createHearts, 1000);
    </script>
</head>
<body>
    <div class="collage">
        <img src="1.png" alt="Photo 1" onclick="enlargeImage(this.src)">
        <img src="2.png" alt="Photo 2" onclick="enlargeImage(this.src)">
        <img src="3.png" alt="Photo 3" onclick="enlargeImage(this.src)">
        <img src="4.png" alt="Photo 4" onclick="enlargeImage(this.src)">
    </div>
    <div class="poem">
        <p>On your birthday, joy and cheer,</p>
        <p>Smiles and laughter, love sincere.</p>
        <p>Wishing you dreams bright and true,</p>
        <p>Happiness in all you do!</p>
        <p>Though miles apart, my heart is near,</p>
        <p>A gift I can't give, but love sincere.</p>
        <p>Through every moment, far or wide,</p>
        <p>I'm always here, right by your side.</p>
    </div>
    <div id="fullscreen" class="fullscreen" onclick="closeFullscreen()">
        <img id="fullscreen-img" src="" alt="Fullscreen Image">
    </div>
</body>
</html>
